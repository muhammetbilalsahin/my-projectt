<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin • Projects</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="css/admin.css" rel="stylesheet" />
  </head>

  <body>
    <div class="admin-wrap">
      <aside class="sidebar">
        <div class="brand">AK YAPI</div>
        <nav>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-projects.html" class="active">Projects</a>
          <a href="admin-login.html" id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div class="d-flex justify-content-between">
            <span>Projeler</span>

            <!-- MODAL BUTTON -->
            <button
              class="btn btn-primary btn-sm"
              data-bs-toggle="modal"
              data-bs-target="#projectModal"
            >
              + Proje Ekle
            </button>
          </div>
        </header>

        <section class="page">
          <div class="card">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Başlık</th>
                  <th>Kategori</th>
                  <th>İşlemler</th>
                </tr>
              </thead>
              <tbody id="projectsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal fade" id="projectModal">
      <div class="modal-dialog">
        <form class="modal-content" id="projectForm">
          <div class="modal-header">
            <h5 id="modalTitle">Proje Ekle</h5>
          </div>

          <div class="modal-body">
            <input
              name="title"
              class="form-control mb-2"
              placeholder="Başlık"
              required
            />

            <!-- KATEGORİ SEÇİMİ -->
            <select name="category" class="form-select mb-2">
              <option value="">Kategori Seç</option>
              <option value="yenileme">Yenileme</option>
              <option value="mimari">Mimari</option>
              <option value="tabela">Tabela</option>
              <option value="baski">Baskı</option>
              <option value="montajlama">Montajlama</option>
            </select>

            <textarea
              name="description"
              class="form-control mb-2"
              placeholder="Açıklama"
            ></textarea>

            <input type="file" name="images" class="form-control" multiple />
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Kapat
            </button>

            <button type="submit" class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ✅ BOOTSTRAP 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ADMIN JS -->
    <script type="module" src="js/admin-projects.js"></script>
  </body>
</html>

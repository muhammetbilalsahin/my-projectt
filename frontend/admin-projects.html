<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin • Projects</title>
    <link href="../css/bootstrap.css" rel="stylesheet" />
    <link href="css/admin.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-wrap">
      <aside class="sidebar">
        <div class="brand">AK YAPI</div>
        <nav>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-projects.html" class="active">Projects</a>
          <a href="admin-login.html" id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div class="d-flex justify-content-between">
            <span>Projeler</span>
            <button
              class="btn btn-primary btn-sm"
              data-bs-toggle="modal"
              data-bs-target="#projectModal"
            >
              + Proje Ekle
            </button>
          </div>
        </header>

        <section class="page">
          <div class="card">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Başlık</th>
                  <th>Kategori</th>
                  <th>İşlemler</th>
                </tr>
              </thead>
              <tbody id="projectsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="projectModal">
      <div class="modal-dialog">
        <form class="modal-content" id="projectForm">
          <div class="modal-header"><h5>Proje Ekle</h5></div>
          <div class="modal-body">
            <input
              name="title"
              class="form-control mb-2"
              placeholder="Başlık"
              required
            />
            <input
              name="category"
              class="form-control mb-2"
              placeholder="Kategori"
            />
            <textarea
              name="description"
              class="form-control mb-2"
              placeholder="Açıklama"
            ></textarea>
            <input type="file" name="image" class="form-control" />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Kapat
            </button>
            <button class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="js/admin-projects.js"></script>
  </body>
</html>

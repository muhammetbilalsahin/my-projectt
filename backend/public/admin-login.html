<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Login</title>
    <link href="css/bootstrap.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
  </head>

  <body>
    <div class="page-wrapper">
      <section class="page-title">
        <div class="auto-container">
          <h1>Admin Login</h1>
          <div class="text">Panel giriş</div>
        </div>
      </section>

      <section class="services-style-one no-padd-top">
        <div class="auto-container">
          <div class="row clearfix">
            <div class="col-md-6 col-sm-12 col-xs-12">
              <div class="default-form">
                <form id="loginForm">
                  <div class="form-group">
                    <input
                      class="form-control"
                      id="email"
                      name="email"
                      type="email"
                      placeholder="Email"
                      required
                    />

                    <input
                      class="form-control"
                      id="password"
                      name="password"
                      type="password"
                      placeholder="Password"
                      required
                    />
                  </div>

                  <button type="submit" class="theme-btn btn-style-two">
                    GİRİŞ YAP
                  </button>

                  <p id="loginMsg" style="margin-top: 10px"></p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="js/admin-login.js"></script>
  </body>
</html>
